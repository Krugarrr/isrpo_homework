name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, lab-6 ]
  pull_request:
    branches: [ main, master, lab-6 ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/TranscriberVCA.sln

      - name: Build solution
        run: dotnet build src/TranscriberVCA.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test src/TranscriberVCA.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: src/TranscriberVCA.Tests/TestResults/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f ./src/TranscriberVCA.Generated/Dockerfile -t transcribervca:latest .

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check for vulnerable packages
        run: dotnet list src/TranscriberVCA.Generated/TranscriberVCA.Generated.csproj package --vulnerable --include-transitive